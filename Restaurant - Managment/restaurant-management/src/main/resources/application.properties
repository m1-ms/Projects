spring.application.name=restaurant-management

# Oracle
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/dborclpdb
spring.datasource.username=hr
spring.datasource.password=hr
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Bundled messages (English / Arabic)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# JWT
app.jwt.secret=restaurant-dev-secret-key-change-me-0123456789
app.jwt.expiration-minutes=1440

# First admin account
app.admin.username=adminuser
app.admin.password=Admin@123
app.admin.age=30

# Allowed front-end (Angular)
app.cors.allowed-origins=http://localhost:4200