
spring.application.name=restaurant-management

# Load local secrets
spring.config.import=optional:classpath:application-secrets.properties

# Oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Bundled messages (English / Arabic)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# JWT
app.jwt.expiration-minutes=1440
app.jwt.cookie-name=storm_auth_token
app.jwt.cookie-secure=false
app.jwt.cookie-same-site=Lax

# First admin account
app.admin.age=22

# Allowed front-end (Angular)
app.cors.allowed-origins=http://localhost:4200

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# Cache expiration
app.cache.default-ttl-minutes=10
app.cache.dashboard-ttl-seconds=60
